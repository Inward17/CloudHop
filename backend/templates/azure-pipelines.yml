# Generated by Cloudhop. Cloudhop creates a pipeline named "cloudhop" from this file and starts it.
# Needs a service connection named "cloudhop" that can issue OIDC tokens (workload identity federation).
trigger: none
pr: none

parameters:
  - name: action
    type: string
    default: verify
  - name: cloud
    type: string
    default: aws
  - name: source
    type: string
    default: ' '

pool:
  vmImage: ubuntu-latest

jobs:
  - job: cloudhop
    timeoutInMinutes: 90
    steps:
      - checkout: self
      - bash: |
          set -euo pipefail
          # Ask Azure DevOps for a short-lived OIDC token for the "cloudhop" service connection.
          CLOUDHOP_OIDC_TOKEN="$(curl -fsS -X POST -H "Authorization: Bearer $SYSTEM_ACCESSTOKEN" -H 'Content-Type: application/json' -d '{}' \
            "$SYSTEM_OIDCREQUESTURI?api-version=7.1&serviceConnectionId=$(CLOUDHOP_SERVICE_CONNECTION_ID)" | jq -r .oidcToken)"
          export CLOUDHOP_OIDC_TOKEN CLOUDHOP_ACTION='${{ parameters.action }}' CLOUDHOP_CLOUD='${{ parameters.cloud }}' CLOUDHOP_SOURCE="$(echo '${{ parameters.source }}' | xargs)"
          export CLOUDHOP_SHA="$(Build.SourceVersion)" CLOUDHOP_RUN_ID="$(Build.BuildId)"
          bash .cloudhop/ci.sh
        displayName: Cloudhop
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          CLOUDHOP_ENV: $(CLOUDHOP_ENV)
          CLOUDHOP_REPORT_TOKEN: $(CLOUDHOP_REPORT_TOKEN)
