# Generated by Cloudhop. Only runs when started from Cloudhop or the Actions tab.
name: cloudhop
run-name: cloudhop ${{ inputs.action }} ${{ inputs.cloud }}

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [verify, plan, deploy, switch, rollback, destroy, report]
      cloud:
        type: choice
        options: [aws, gcp]
      source:
        type: string
        default: ''

permissions:
  id-token: write
  contents: read
  packages: write

concurrency:
  group: cloudhop
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Cloud roles trust only this environment. Add required reviewers to it in repo settings for a second approval.
    environment: cloudhop
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - id: cfg
        run: |
          echo "aws_role=$(jq -r '.clouds.aws.roleArn // ""' .cloudhop/config.json)" >> "$GITHUB_OUTPUT"
          echo "aws_region=$(jq -r '.clouds.aws.region // ""' .cloudhop/config.json)" >> "$GITHUB_OUTPUT"
          echo "gcp_provider=$(jq -r '.clouds.gcp.workloadIdentityProvider // ""' .cloudhop/config.json)" >> "$GITHUB_OUTPUT"
          echo "gcp_account=$(jq -r '.clouds.gcp.serviceAccount // ""' .cloudhop/config.json)" >> "$GITHUB_OUTPUT"
      - if: steps.cfg.outputs.aws_role != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.cfg.outputs.aws_role }}
          aws-region: ${{ steps.cfg.outputs.aws_region }}
          role-duration-seconds: 3600
      - if: steps.cfg.outputs.gcp_provider != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.cfg.outputs.gcp_provider }}
          service_account: ${{ steps.cfg.outputs.gcp_account }}
      - if: steps.cfg.outputs.gcp_provider != ''
        uses: google-github-actions/setup-gcloud@v2
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Run
        env:
          ACTION: ${{ inputs.action }}
          CLOUD: ${{ inputs.cloud }}
          SOURCE: ${{ inputs.source }}
          CLOUDHOP_ENV: ${{ secrets.CLOUDHOP_ENV }}
          CLOUDHOP_REPORT_TOKEN: ${{ secrets.CLOUDHOP_REPORT_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: bash .cloudhop/run.sh "$ACTION" "$CLOUD" "$SOURCE"
