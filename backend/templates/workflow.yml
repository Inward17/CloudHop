# Generated by Cloudhop. Only runs when started from Cloudhop or the Actions tab.
name: cloudhop
run-name: cloudhop ${{ inputs.action }} ${{ inputs.cloud }}

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [verify, plan, deploy, switch, rollback, destroy, report]
      cloud:
        type: choice
        options: [aws, gcp, digitalocean, hetzner, hostinger]
      source:
        type: string
        default: ''
      request:
        description: Set by Cloudhop for each approved action
        type: string
        default: ''

# Actions are pinned to commits, so a moved tag cannot change what runs with cloud access.
permissions:
  id-token: write
  contents: read

concurrency:
  group: cloudhop
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Cloud roles trust only this environment. Add required reviewers to it in repo settings for a second approval.
    environment: cloudhop
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: cfg
        run: |
          echo "aws_role=$(jq -r '.clouds.aws.roleArn // ""' .cloudhop/config.json)" >> "$GITHUB_OUTPUT"
          echo "aws_region=$(jq -r '.clouds.aws.region // ""' .cloudhop/config.json)" >> "$GITHUB_OUTPUT"
          echo "gcp_provider=$(jq -r '.clouds.gcp.workloadIdentityProvider // ""' .cloudhop/config.json)" >> "$GITHUB_OUTPUT"
          echo "gcp_account=$(jq -r '.clouds.gcp.serviceAccount // ""' .cloudhop/config.json)" >> "$GITHUB_OUTPUT"
      - if: steps.cfg.outputs.aws_role != ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ steps.cfg.outputs.aws_role }}
          aws-region: ${{ steps.cfg.outputs.aws_region }}
          role-duration-seconds: 3600
      - if: steps.cfg.outputs.gcp_provider != ''
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ steps.cfg.outputs.gcp_provider }}
          service_account: ${{ steps.cfg.outputs.gcp_account }}
      - if: steps.cfg.outputs.gcp_provider != ''
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: 1.13.2
          tofu_wrapper: false
      - name: Run
        env:
          ACTION: ${{ inputs.action }}
          CLOUD: ${{ inputs.cloud }}
          SOURCE: ${{ inputs.source }}
          REQUEST: ${{ inputs.request }}
          CLOUDHOP_ENV: ${{ secrets.CLOUDHOP_ENV }}
          CLOUDHOP_REPORT_TOKEN: ${{ secrets.CLOUDHOP_REPORT_TOKEN }}
          # DigitalOcean, Hetzner and Hostinger only: they have no CI sign-in, so a scoped token and an SSH key live here.
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          CLOUDHOP_SSH_KEY: ${{ secrets.CLOUDHOP_SSH_KEY }}
        run: bash .cloudhop/run.sh "$ACTION" "$CLOUD" "$SOURCE" "$REQUEST"
