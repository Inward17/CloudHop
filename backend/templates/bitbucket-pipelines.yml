# Generated by Cloudhop. A custom pipeline, so it runs only when Cloudhop starts it.
# If this repo already has bitbucket-pipelines.yml, copy the `custom: cloudhop` section into it.
image: ubuntu:24.04

pipelines:
  custom:
    cloudhop:
      - variables:
          - name: CLOUDHOP_ACTION
            allowed-values: [verify, plan, deploy, switch, rollback, destroy, report]
          - name: CLOUDHOP_CLOUD
            allowed-values: [aws, gcp]
          - name: CLOUDHOP_SOURCE
            default: ''
      - step:
          name: Cloudhop
          max-time: 90
          # Short-lived OIDC token that AWS and GCP trust for this repository only.
          oidc: true
          script:
            - export CLOUDHOP_OIDC_TOKEN="$BITBUCKET_STEP_OIDC_TOKEN" CLOUDHOP_SHA="$BITBUCKET_COMMIT" CLOUDHOP_RUN_ID="$BITBUCKET_BUILD_NUMBER"
            - bash .cloudhop/ci.sh
