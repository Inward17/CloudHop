# Generated by Cloudhop. Runs only when Cloudhop starts a pipeline with CLOUDHOP_ACTION set,
# so your other pipelines are unaffected.
workflow:
  name: 'cloudhop $CLOUDHOP_ACTION $CLOUDHOP_CLOUD'
  rules:
    - if: $CLOUDHOP_ACTION

cloudhop:
  image: ubuntu:24.04
  timeout: 90m
  resource_group: cloudhop
  environment:
    name: cloudhop
  # Short-lived OIDC token that AWS and GCP trust for this project's default branch only.
  id_tokens:
    CLOUDHOP_OIDC_TOKEN:
      aud: https://gitlab.com
  variables:
    CLOUDHOP_SHA: $CI_COMMIT_SHA
    CLOUDHOP_RUN_ID: $CI_PIPELINE_ID
  script:
    - bash .cloudhop/ci.sh
