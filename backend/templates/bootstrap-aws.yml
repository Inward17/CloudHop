# Cloudhop access for one GitHub repo. Upload in AWS Console > CloudFormation > Create stack.
# Grants: GitHub Actions in that repo can assume cloudhop-deploy. No long-lived keys are created.
AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  GitHubRepo:
    Type: String
    Default: __REPO__
  CreateOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Set false if this account already has the GitHub OIDC provider.
Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, 'true']
Resources:
  Provider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
  StateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub cloudhop-state-${AWS::AccountId}
      VersioningConfiguration: { Status: Enabled }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cloudhop-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Only jobs in the repo's protected `cloudhop` environment, not any branch or pull request.
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepo}:environment:cloudhop
      Policies:
        - PolicyName: cloudhop
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['ec2:*', 'ssm:SendCommand', 'ssm:GetCommandInvocation', 'ssm:GetParameter', 'ssm:GetParameters', 'ssm:DescribeInstanceInformation', 'ce:GetCostAndUsage', 'billing:GetCredits', 'sts:GetCallerIdentity']
                Resource: '*'
              - Effect: Allow
                Action: 's3:*'
                Resource:
                  - arn:aws:s3:::cloudhop-*
                  - arn:aws:s3:::cloudhop-*/*
              - Effect: Allow
                Action: ['iam:*Role', 'iam:*RolePolicy', 'iam:*RolePolicies', 'iam:*AttachedRolePolicies', 'iam:AttachRolePolicy', 'iam:DetachRolePolicy', 'iam:PassRole', 'iam:ListInstanceProfilesForRole', 'iam:TagRole', 'iam:*InstanceProfile', 'iam:AddRoleToInstanceProfile', 'iam:RemoveRoleFromInstanceProfile']
                Resource:
                  # Only VM roles, so this role cannot edit its own permissions.
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/cloudhop-*-vm
                  - !Sub arn:aws:iam::${AWS::AccountId}:instance-profile/cloudhop-*-vm
Outputs:
  RoleArn:
    Value: !GetAtt DeployRole.Arn
