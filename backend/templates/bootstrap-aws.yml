# Cloudhop access for __REPO__. Upload in AWS Console > CloudFormation > Create stack.
# Grants: CI jobs for that repo (and only those) can assume cloudhop-__NAME__-deploy. No long-lived keys are created.
AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  CreateOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Set false if this account already trusts https://__ISSUER__ (from another Cloudhop project).
  CreateStateBucket:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Set false if this account already has the cloudhop-state bucket (from another Cloudhop project).
Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, 'true']
  MakeBucket: !Equals [!Ref CreateStateBucket, 'true']
Resources:
  Provider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://__ISSUER__
      ClientIdList: ['__AWS_AUDIENCE__']
  StateBucket:
    Type: AWS::S3::Bucket
    Condition: MakeBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub cloudhop-state-${AWS::AccountId}
      VersioningConfiguration: { Status: Enabled }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cloudhop-__NAME__-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/__ISSUER__
            Condition:
              StringEquals:
                '__ISSUER__:aud': '__AWS_AUDIENCE__'
              # Only this repo's protected CI identity, not other repos on the same CI.
              StringLike:
                '__ISSUER__:sub': '__SUBJECT__'
      Policies:
        - PolicyName: cloudhop
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['ec2:*', 'ssm:SendCommand', 'ssm:GetCommandInvocation', 'ssm:GetParameter', 'ssm:GetParameters', 'ssm:DescribeInstanceInformation', 'ce:GetCostAndUsage', 'billing:GetCredits', 'sts:GetCallerIdentity']
                Resource: '*'
              - Effect: Allow
                Action: 's3:*'
                Resource:
                  - arn:aws:s3:::cloudhop-*
                  - arn:aws:s3:::cloudhop-*/*
              - Effect: Allow
                Action: ['iam:*Role', 'iam:*RolePolicy', 'iam:*RolePolicies', 'iam:*AttachedRolePolicies', 'iam:AttachRolePolicy', 'iam:DetachRolePolicy', 'iam:PassRole', 'iam:ListInstanceProfilesForRole', 'iam:TagRole', 'iam:*InstanceProfile', 'iam:AddRoleToInstanceProfile', 'iam:RemoveRoleFromInstanceProfile']
                Resource:
                  # Only VM roles, so this role cannot edit its own permissions.
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/cloudhop-*-vm
                  - !Sub arn:aws:iam::${AWS::AccountId}:instance-profile/cloudhop-*-vm
              - Effect: Allow
                # Lets a verify run show which actions this role may do. Only on itself, and read-only.
                Action: iam:SimulatePrincipalPolicy
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/cloudhop-__NAME__-deploy
Outputs:
  RoleArn:
    Value: !GetAtt DeployRole.Arn
