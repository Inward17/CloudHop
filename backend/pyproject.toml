[project]
name = "cloudhop"
version = "0.1.0"
description = "Cloudhop API: deploy a repo to your own cloud and switch clouds with approval."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.setuptools]
packages = ["cloudhop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 300

[tool.ruff.lint]
select = ["E", "F", "B"]
