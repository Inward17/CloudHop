name: Bug report
description: Something in Cloudhop does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security problems do not go here**: follow SECURITY.md instead.
        Never paste tokens, keys, `.env` contents or other secrets. Remove them from logs before pasting.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what happened, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Dashboard (my own Cloudhop)
        - Demo (inward17.github.io/CloudHop/demo)
        - Generated pipeline or setup file in my repo
        - Backend or API
        - Other
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Sign-in and accounts
        - Projects and setup
        - Deploy, switch, rollback or destroy
        - Platform moves (Vercel, Cloudflare Pages)
        - Agent and commands
        - Metrics, logs and costs
        - Accessibility
        - Other
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: The Cloudhop commit you run, if you know it (`git rev-parse --short HEAD`).
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Firefox 133 on Windows 11, Safari on iPhone 15, ...
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Error messages, pipeline log lines or screenshots, with secrets removed.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed all secrets, tokens and personal data from this report.
          required: true
