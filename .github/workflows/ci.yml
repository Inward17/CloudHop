name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check cloudhop tests scripts
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check scripts parse
        run: |
          node --check frontend/public/app.js
          node --check frontend/public/charts.js
          node --check frontend/dev-server.mjs
          node --check demo/mock.js
      - name: Build the demo
        run: node demo/build.js _site && node --check _site/demo/demo.js

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint generated shell scripts
        run: shellcheck --severity=warning backend/templates/run.sh backend/templates/ci.sh backend/templates/bootstrap-gcp.sh

  # Validates what users actually receive: OpenTofu files against the real AWS and Google providers,
  # and the AWS and GCP setup files rendered for every code host.
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate OpenTofu files
        run: |
          for cloud in aws gcp; do
            mkdir -p "/tmp/infra/$cloud"
            cp "backend/templates/$cloud.tf" "/tmp/infra/$cloud/main.tf"
            tofu -chdir="/tmp/infra/$cloud" init -backend=false -input=false
            tofu -chdir="/tmp/infra/$cloud" validate
          done
      - name: Lint setup files for every code host
        run: |
          pip install --quiet cfn-lint -e backend
          python backend/scripts/render_setup_files.py /tmp/setup
          cfn-lint /tmp/setup/*-aws.yml
          for file in /tmp/setup/*-gcp.sh; do bash -n "$file"; done
          shellcheck --severity=warning /tmp/setup/*-gcp.sh

  # Runs the AWS path for real against LocalStack: setup file through CloudFormation, OIDC sign-in,
  # OpenTofu with the S3 state backend, and verify, plan, deploy, report and destroy. LocalStack has
  # no real servers, so the app is not built or started there. 4.14.0 is the last Community image
  # that runs without a LocalStack account; newer images need LOCALSTACK_AUTH_TOKEN.
  aws-localstack:
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:4.14.0
        ports: ['4566:4566']
        env:
          SERVICES: iam,sts,s3,ec2,ssm,cloudformation
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false
      - run: pip install -e ".[dev]"
      - name: Wait for LocalStack
        run: for i in $(seq 1 60); do curl -fs localhost:4566/_localstack/health && break; sleep 2; done
      - name: AWS end to end on LocalStack
        run: python -m pytest -q -s tests/test_localstack.py
        env:
          LOCALSTACK_URL: http://localhost:4566
