# Publishes the demo (real dashboard, sample data, no backend) to GitHub Pages at /CloudHop/demo/.
# The real app is a separate FastAPI server; see README.
name: Demo

on:
  push:
    branches: [main]
    paths: ['demo/**', 'frontend/public/**', 'backend/templates/**', '.github/workflows/demo.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build demo
        run: |
          node demo/build.js _site
          node --check _site/demo/demo.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}demo/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
